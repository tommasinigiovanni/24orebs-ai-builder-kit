#cloud-config
# AI Builder, kit studenti, versione {VERSIONE}.
# Seleziona in Hetzner la tua chiave pubblica insieme a questo cloud-init.
disable_root: false
ssh_pwauth: false
packages: [curl, ca-certificates]
runcmd:
  - [bash, -c, 'set -euo pipefail; cd /root; curl -fsSL --retry 10 --retry-all-errors --retry-delay 10 --max-time 180 -o kit.tar.gz https://github.com/{REPOSITORY}/releases/download/{VERSIONE}/24orebs-ai-builder-kit-{VERSIONE}.tar.gz; echo "{IMPRONTA}  kit.tar.gz" | sha256sum -c -; mkdir -p /opt/agenti-kit; tar -xzf kit.tar.gz -C /opt --no-same-owner; AGENTI_PROFILO=24ore bash /opt/agenti-kit/install.sh']

#cloud-config
# AI Builder, kit studenti, versione v1.3.
# Seleziona in Hetzner la tua chiave pubblica insieme a questo cloud-init.
disable_root: false
ssh_pwauth: false
packages: [curl, ca-certificates]
runcmd:
  - [bash, -c, 'set -euo pipefail; cd /root; curl -fsSL --retry 10 --retry-all-errors --retry-delay 10 --max-time 180 -o kit.tar.gz https://github.com/tommasinigiovanni/24orebs-ai-builder-kit/releases/download/v1.3/24orebs-ai-builder-kit-v1.3.tar.gz; echo "2201109f6311d1cffbd9f0d8865379c7ddaac0e48107bab1338535e7d6e7a05f  kit.tar.gz" | sha256sum -c -; mkdir -p /opt/agenti-kit; tar -xzf kit.tar.gz -C /opt --no-same-owner; AGENTI_PROFILO=24ore bash /opt/agenti-kit/install.sh']

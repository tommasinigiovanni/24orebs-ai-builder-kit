#cloud-config
# AI Builder, kit studenti, versione v1.2.
# Seleziona in Hetzner la tua chiave pubblica insieme a questo cloud-init.
disable_root: false
ssh_pwauth: false
packages: [curl, ca-certificates]
runcmd:
  - [bash, -c, 'set -euo pipefail; cd /root; curl -fsSL --retry 10 --retry-all-errors --retry-delay 10 --max-time 180 -o kit.tar.gz https://github.com/tommasinigiovanni/24orebs-ai-builder-kit/releases/download/v1.2/24orebs-ai-builder-kit-v1.2.tar.gz; echo "76756455bb24fc1efdf9fd9c87ec541f628f06aed003e3cfe45f8e3290cae64a  kit.tar.gz" | sha256sum -c -; mkdir -p /opt/agenti-kit; tar -xzf kit.tar.gz -C /opt --no-same-owner; AGENTI_PROFILO=24ore bash /opt/agenti-kit/install.sh']
